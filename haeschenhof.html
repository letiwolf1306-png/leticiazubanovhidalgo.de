
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Häschenhof</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Trebuchet MS', sans-serif;
  background: #fff6ed;
  color: #55483f;
}

button { font: inherit; cursor: pointer; }

.game {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

header { text-align: center; }

h1 {
  font-size: clamp(30px, 6vw, 48px);
  color: #8eaa78;
  margin: 10px 0;
}

.subtitle { color: #9e8c7d; }

.stats {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0;
}

.stat {
  background: white;
  border: 2px solid #f0dfd0;
  border-radius: 16px;
  padding: 10px 16px;
}

.meadow {
  position: relative;
  overflow: hidden;
  min-height: 330px;
  border: 5px solid #d4e6b5;
  border-radius: 28px;
  background: linear-gradient(#d9f0f7 0 35%, #bce1a1 35% 100%);
  padding: 24px 12px;
}

.sun {
  position: absolute;
  right: 30px;
  top: 20px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #ffe7a0;
}

.cloud {
  position: absolute;
  left: 40px;
  top: 40px;
  color: white;
  font-size: 38px;
}

.bunnies {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: end;
  gap: 10px;
  min-height: 270px;
}

.bunny {
  width: 145px;
  min-height: 205px;
  border: 0;
  border-radius: 22px;
  background: #ffffffb8;
  padding: 10px 6px;
  color: #55483f;
  transition: transform .2s, background .2s;
}

.bunny:hover {
  transform: translateY(-5px);
  background: white;
}

.bunny.selected {
  outline: 3px solid #f4b8c4;
  background: #fff;
}

.rabbit {
  font-size: 76px;
  line-height: 1.3;
  display: block;
  filter: drop-shadow(0 4px 2px #82765b22);
}

.name {
  display: block;
  font-weight: bold;
  margin: 3px;
}

.mood { font-size: 13px; }

.hearts {
  margin-top: 6px;
  letter-spacing: 2px;
  color: #e58b9c;
  font-size: 14px;
}

.food-title {
  text-align: center;
  margin: 24px 0 12px;
}

.foods {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.food {
  border: 2px solid #eadbca;
  background: white;
  border-radius: 20px;
  padding: 15px 5px;
  color: #55483f;
}

.food:hover { background: #f7f9e9; }

.food.active {
  border-color: #8eaa78;
  background: #eef6df;
}

.food-icon {
  display: block;
  font-size: 38px;
  margin-bottom: 5px;
}

.food small {
  display: block;
  color: #8d8074;
  margin-top: 5px;
}

.action {
  display: block;
  margin: 18px auto;
  width: 100%;
  max-width: 360px;
  padding: 15px;
  border: 0;
  border-radius: 18px;
  background: #91b879;
  color: white;
  font-weight: bold;
  font-size: 17px;
}

.action:hover { background: #7ea465; }

.message {
  min-height: 48px;
  text-align: center;
  padding: 12px;
  color: #8a7867;
}

.shop {
  background: white;
  border: 2px solid #f0dfd0;
  border-radius: 20px;
  padding: 18px;
  margin-top: 24px;
}

.shop h2 { margin-top: 0; }

.shop-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-top: 1px solid #f2e9df;
}

.shop button {
  border: 0;
  background: #f5d5a9;
  border-radius: 12px;
  padding: 10px 14px;
  color: #5b4939;
}

.shop button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

footer {
  text-align: center;
  color: #a69789;
  font-size: 12px;
  padding: 20px;
}

@media (max-width: 480px) {
  .game { padding: 12px; }
  .bunny { width: 43%; }
  .rabbit { font-size: 65px; }
  .meadow { padding: 15px 6px; }
  .stat { padding: 9px 11px; font-size: 14px; }
}
</style>
</head>
<body>
<main class="game">
  <header>
    <h1>Häschenhof</h1>
    <div class="subtitle">Ein kleines Zuhause für hungrige Häschen</div>
  </header>

  <div class="stats">
    <div class="stat">🥕 Karotten: <b id="carrots">8</b></div>
    <div class="stat">🪙 Münzen: <b id="coins">0</b></div>
    <div class="stat">🐰 Häschen: <b id="count">3</b></div>
  </div>

  <section class="meadow">
    <div class="sun"></div>
    <div class="cloud">☁</div>
    <div class="bunnies" id="bunnies"></div>
  </section>

  <h2 class="food-title">Was möchtest du füttern?</h2>

  <div class="foods">
    <button class="food active" data-food="carrot">
      <span class="food-icon">🥕</span>
      Karotte
      <small>+3 Herzen · 1 Karotte</small>
    </button>
    <button class="food" data-food="lettuce">
      <span class="food-icon">🥬</span>
      Salat
      <small>+2 Herzen · 1 Salat</small>
    </button>
    <button class="food" data-food="clover">
      <span class="food-icon">🍀</span>
      Klee
      <small>+1 Herz · kostenlos</small>
    </button>
  </div>

  <button class="action" id="feed">🥕 Häschen füttern!</button>
  <div class="message" id="message" aria-live="polite">
    Wähle ein Häschen auf der Wiese aus.
  </div>

  <section class="shop">
    <h2>Der kleine Häschenladen</h2>
    <p>Verdiene Münzen durch Füttern und hole dir neue Freunde.</p>
    <div id="shop"></div>
  </section>

  <footer>Häschenhof · Ein kleines Spiel zum Entspannen</footer>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const foodInfo = {
    carrot: { name: "Karotte", icon: "🥕", hearts: 3 },
    lettuce: { name: "Salat", icon: "🥬", hearts: 2 },
    clover: { name: "Klee", icon: "🍀", hearts: 1 }
  };

  const rabbitTypes = [
    { name: "Möhrchen", emoji: "🐰", color: "#fff1df", price: 0 },
    { name: "Wölkchen", emoji: "🐇", color: "#eeeeee", price: 12 },
    { name: "Keks", emoji: "🐰", color: "#e8bc8f", price: 18 },
    { name: "Flocke", emoji: "🐇", color: "#fffafa", price: 25 },
    { name: "Zimt", emoji: "🐰", color: "#d99b73", price: 35 },
    { name: "Blümchen", emoji: "🐇", color: "#f5d4e8", price: 50 }
  ];

  let carrots = 8;
  let lettuce = 4;
  let coins = 0;
  let selectedFood = "carrot";
  let selectedRabbit = 0;
  let nextId = 3;

  let rabbits = [
    { id: 0, name: "Möhrchen", emoji: "🐰", hearts: 0, max: 10 },
    { id: 1, name: "Wölkchen", emoji: "🐇", hearts: 0, max: 10 },
    { id: 2, name: "Keks", emoji: "🐰", hearts: 0, max: 10 }
  ];

  function renderRabbits() {
    $("bunnies").innerHTML = "";

    rabbits.forEach(r => {
      const el = document.createElement("button");
      el.className = "bunny" +
        (r.id === selectedRabbit ? " selected" : "");
      el.setAttribute("aria-label", r.name + " auswählen");

      const heartCount = Math.floor(r.hearts / 2);
      const heartsText = "♥".repeat(heartCount) +
        "♡".repeat(5 - heartCount);

      el.innerHTML = `
        <span class="rabbit">${r.emoji}</span>
        <span class="name">${r.name}</span>
        <span class="mood">${mood(r.hearts)}</span>
        <span class="hearts">${heartsText}</span>
      `;

      el.addEventListener("click", () => {
        selectedRabbit = r.id;
        renderRabbits();
        $("message").textContent =
          r.name + " schaut dich erwartungsvoll an!";
      });

      $("bunnies").appendChild(el);
    });
  }

  function mood(hearts) {
    if (hearts >= 10) return "Sehr glücklich!";
    if (hearts >= 6) return "Satt und zufrieden";
    if (hearts >= 2) return "Möchte mehr essen";
    return "Hungrig ...";
  }

  function updateStats() {
    $("carrots").textContent = carrots;
    $("coins").textContent = coins;
    $("count").textContent = rabbits.length;
  }

  function feedRabbit() {
    const rabbit = rabbits.find(r => r.id === selectedRabbit);
    if (!rabbit) return;

    if (selectedFood === "carrot" && carrots < 1) {
      $("message").textContent = "Keine Karotten mehr! Kaufe welche im Laden.";
      return;
    }

    if (selectedFood === "lettuce" && lettuce < 1) {
      $("message").textContent = "Kein Salat mehr! Kaufe welchen im Laden.";
      return;
    }

    if (rabbit.hearts >= 10) {
      $("message").textContent =
        rabbit.name + " ist schon ganz satt. Wähle ein anderes Häschen!";
      return;
    }

    const food = foodInfo[selectedFood];

    if (selectedFood === "carrot") carrots--;
    if (selectedFood === "lettuce") lettuce--;

    const oldHearts = rabbit.hearts;
    rabbit.hearts = Math.min(10, rabbit.hearts + food.hearts);
    const gained = rabbit.hearts - oldHearts;

    coins += gained;
    updateStats();
    renderRabbits();
    renderShop();

    $("message").textContent =
      food.icon + " " + rabbit.name + " knabbert glücklich! +" +
      gained + " Herzen und " + gained + " Münzen.";
  }

  function renderShop() {
    $("shop").innerHTML = "";

    const items = [
      { name: "5 Karotten", icon: "🥕", price: 5, buy: () => carrots += 5 },
      { name: "5 Salatblätter", icon: "🥬", price: 5, buy: () => lettuce += 5 }
    ];

    items.forEach(item => {
      const row = document.createElement("div");
      row.className = "shop-row";
      row.innerHTML = `
        <span>${item.icon} ${item.name}</span>
        <button ${coins < item.price ? "disabled" : ""}>
          ${item.price} Münzen
        </button>
      `;

      row.querySelector("button").addEventListener("click", () => {
        if (coins < item.price) return;
        coins -= item.price;
        item.buy();
        updateStats();
        renderShop();
        $("message").textContent = item.name + " gekauft!";
      });

      $("shop").appendChild(row);
    });

    rabbitTypes.forEach(type => {
      if (rabbits.some(r => r.name === type.name)) return;

      const row = document.createElement("div");
      row.className = "shop-row";
      row.innerHTML = `
        <span>${type.emoji} ${type.name}</span>
        <button ${coins < type.price ? "disabled" : ""}>
          ${type.price} Münzen
        </button>
      `;

      row.querySelector("button").addEventListener("click", () => {
        if (coins < type.price) return;

        coins -= type.price;
        const newRabbit = {
          id: nextId++,
          name: type.name,
          emoji: type.emoji,
          hearts: 0,
          max: 10
        };

        rabbits.push(newRabbit);
        selectedRabbit = newRabbit.id;

        updateStats();
        renderRabbits();
        renderShop();

        $("message").textContent =
          type.name + " ist auf deinem Häschenhof eingezogen!";
      });

      $("shop").appendChild(row);
    });
  }

  document.querySelectorAll(".food").forEach(button => {
    button.addEventListener("click", () => {
      selectedFood = button.dataset.food;

      document.querySelectorAll(".food").forEach(b =>
        b.classList.toggle("active", b === button)
      );
    });
  });

  $("feed").addEventListener("click", feedRabbit);

  renderRabbits();
  updateStats();
  renderShop();
})();
</script>
</body>
</html>
